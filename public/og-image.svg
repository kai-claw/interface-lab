<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient orbs -->
  <circle cx="200" cy="150" r="120" fill="#6366f1" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="200" r="100" fill="#ec4899" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="500" r="90" fill="#10b981" opacity="0.08" filter="url(#glow)"/>

  <!-- Grid dots pattern -->
  <g opacity="0.06" fill="#e4e4ef">
    <circle cx="100" cy="100" r="2"/><circle cx="200" cy="100" r="2"/><circle cx="300" cy="100" r="2"/><circle cx="400" cy="100" r="2"/><circle cx="500" cy="100" r="2"/>
    <circle cx="600" cy="100" r="2"/><circle cx="700" cy="100" r="2"/><circle cx="800" cy="100" r="2"/><circle cx="900" cy="100" r="2"/><circle cx="1000" cy="100" r="2"/><circle cx="1100" cy="100" r="2"/>
    <circle cx="100" cy="200" r="2"/><circle cx="200" cy="200" r="2"/><circle cx="300" cy="200" r="2"/><circle cx="400" cy="200" r="2"/><circle cx="500" cy="200" r="2"/>
    <circle cx="600" cy="200" r="2"/><circle cx="700" cy="200" r="2"/><circle cx="800" cy="200" r="2"/><circle cx="900" cy="200" r="2"/><circle cx="1000" cy="200" r="2"/><circle cx="1100" cy="200" r="2"/>
    <circle cx="100" cy="300" r="2"/><circle cx="200" cy="300" r="2"/><circle cx="300" cy="300" r="2"/><circle cx="400" cy="300" r="2"/><circle cx="500" cy="300" r="2"/>
    <circle cx="600" cy="300" r="2"/><circle cx="700" cy="300" r="2"/><circle cx="800" cy="300" r="2"/><circle cx="900" cy="300" r="2"/><circle cx="1000" cy="300" r="2"/><circle cx="1100" cy="300" r="2"/>
    <circle cx="100" cy="400" r="2"/><circle cx="200" cy="400" r="2"/><circle cx="300" cy="400" r="2"/><circle cx="400" cy="400" r="2"/><circle cx="500" cy="400" r="2"/>
    <circle cx="600" cy="400" r="2"/><circle cx="700" cy="400" r="2"/><circle cx="800" cy="400" r="2"/><circle cx="900" cy="400" r="2"/><circle cx="1000" cy="400" r="2"/><circle cx="1100" cy="400" r="2"/>
    <circle cx="100" cy="500" r="2"/><circle cx="200" cy="500" r="2"/><circle cx="300" cy="500" r="2"/><circle cx="400" cy="500" r="2"/><circle cx="500" cy="500" r="2"/>
    <circle cx="600" cy="500" r="2"/><circle cx="700" cy="500" r="2"/><circle cx="800" cy="500" r="2"/><circle cx="900" cy="500" r="2"/><circle cx="1000" cy="500" r="2"/><circle cx="1100" cy="500" r="2"/>
  </g>

  <!-- Emoji row -->
  <text x="600" y="220" text-anchor="middle" font-size="56" opacity="0.8">🃏 🧲 🪂 🫧 ✍️ 🎇 🔀 💥</text>

  <!-- Title -->
  <text x="600" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="72" fill="url(#accent)">Interface Lab</text>

  <!-- Subtitle -->
  <text x="600" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="28" fill="#8888a0">Novel UI/UX Exploration Gallery</text>

  <!-- Tech tags -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#8888a0" opacity="0.6">
    <rect x="340" y="450" width="85" height="32" rx="8" fill="#ffffff" opacity="0.04"/>
    <text x="382" y="472" text-anchor="middle">React</text>
    <rect x="445" y="450" width="148" height="32" rx="8" fill="#ffffff" opacity="0.04"/>
    <text x="519" y="472" text-anchor="middle">Framer Motion</text>
    <rect x="613" y="450" width="90" height="32" rx="8" fill="#ffffff" opacity="0.04"/>
    <text x="658" y="472" text-anchor="middle">Canvas</text>
    <rect x="723" y="450" width="130" height="32" rx="8" fill="#ffffff" opacity="0.04"/>
    <text x="788" y="472" text-anchor="middle">Tailwind CSS</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="200" y="540" width="800" height="3" rx="1.5" fill="url(#accent)" opacity="0.3"/>

  <!-- 8 experiments badge -->
  <rect x="510" y="555" width="180" height="30" rx="15" fill="#ffffff" opacity="0.04"/>
  <text x="600" y="576" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8888a0" opacity="0.7">8 interactive experiments</text>
</svg>
